<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1010" viewBox="0 0 1000 1010" role="img" aria-labelledby="title desc">
<title id="title">SaaS finance platform architecture</title>
<desc id="desc">Synthetic sources flow through Python, BigQuery, dbt, a verified export and a local dashboard. SQLite independently checks the export. Hosting is a separate publication step. GitHub Actions runs offline tests.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#315f8c"/></marker></defs>
