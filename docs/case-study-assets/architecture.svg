<text x="40" y="48" font-size="28" font-weight="700">From source records to finance reporting</text>
<text x="40" y="78" font-size="17" fill="#526579">Implemented workflow · Synthetic data only · October 2026</text>
<g fill="white" stroke="#c8d5e3" stroke-width="1.5">
<rect x="40" y="110" width="920" height="100" rx="12"/>
<rect x="40" y="250" width="580" height="100" rx="12"/>
