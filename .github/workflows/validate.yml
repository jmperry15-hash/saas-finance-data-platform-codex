name: Validate synthetic finance data

# Start manually while learning and checking the account's free allowance.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out project code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: python -m pip install -r requirements-ingestion.txt

      - name: Check dependency compatibility
        run: python -m pip check

      - name: Generate fresh synthetic sources
        run: python -m src.synthetic.generate

      - name: Validate saved source files
        run: python -m src.synthetic.validate

      - name: Run Python tests (cloud calls are mocked)
        run: python -m unittest discover -s tests -v

      - name: Check Node runtime supplied by the Ubuntu runner
        run: node --version

      - name: Rebuild and verify dashboard calculations (no cloud calls)
        run: python scripts/check_dashboard_offline.py
